<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lab 02 Cipher Browser</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f5f5f5;
      color: #222;
    }
    .page {
      max-width: 900px;
      margin: 32px auto;
      padding: 24px;
      background: #fff;
      border: 1px solid #ddd;
    }
    h1 {
      margin-top: 0;
      font-size: 28px;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    .field {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 16px;
    }
    label {
      font-weight: 600;
    }
    select,
    input,
    textarea,
    button {
      font: inherit;
      padding: 10px 12px;
      border: 1px solid #999;
      background: #fff;
      color: #222;
    }
    textarea {
      min-height: 150px;
      resize: vertical;
    }
    .actions {
      display: flex;
      gap: 12px;
    }
    .result,
    .error {
      margin-top: 20px;
      padding: 12px;
      border: 1px solid #bbb;
      white-space: pre-wrap;
    }
    .error {
      border-color: #c33;
    }
    @media (max-width: 720px) {
      .page {
        margin: 16px;
        padding: 16px;
      }
      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <h1>Lab 02 Cipher Browser</h1>
    <form method="post">
      <div class="grid">
        <div class="field">
          <label for="algorithm">Thuat toan</label>
          <select id="algorithm" name="algorithm">
            {% for value, label in cipher_options %}
            <option value="{{ value }}" {% if form_data.algorithm == value %}selected{% endif %}>{{ label }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="field">
          <label for="action">Tac vu</label>
          <select id="action" name="action">
            <option value="encrypt" {% if form_data.action == "encrypt" %}selected{% endif %}>Encrypt</option>
            <option value="decrypt" {% if form_data.action == "decrypt" %}selected{% endif %}>Decrypt</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label for="key">Khoa</label>
        <input id="key" name="key" value="{{ form_data.key }}">
      </div>

      <div class="field">
        <label for="text">Noi dung</label>
        <textarea id="text" name="text">{{ form_data.text }}</textarea>
      </div>

      <div class="actions">
        <button type="submit">Xu ly</button>
      </div>
    </form>

    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}

    {% if result %}
    <div class="result">{{ result }}</div>
    {% endif %}
  </div>
</body>
</html>
